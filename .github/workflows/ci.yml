Name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'wings110/WeKit-dev' &&
      !startsWith(github.event.head_commit.message || '', '[skip ci]') &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        github.ref == 'refs/heads/master'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        run: |
          NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          MIN_SDK=$(sed -n 's/^minSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          NDK_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android$MIN_SDK-clang"
          test -x "$NDK_BIN/llvm-strip"

      - name: Prepare PRoot cache key
        id: proot_cache_inputs
        run: |
          echo "commit=$(git -C third_party/proot-static rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(sed -n 's/^ndk = \"\(.*\)\"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
          echo "min_sdk=$(sed -n 's/^minSdk = \"\(.*\)\"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Cache PRoot build
        uses: actions/cache@v6
        with:
          path: target/proot-static
          key: proot-${{ runner.os }}-${{ runner.arch }}-${{ steps.proot_cache_inputs.outputs.commit }}-${{ steps.proot_cache_inputs.outputs.ndk }}-${{ steps.proot_cache_inputs.outputs.min_sdk }}-${{ hashFiles('patches/proot/android-ptrace-events.patch', 'third_party/proot-static/tools/build-static-aarch64.sh') }}
          restore-keys: |
            proot-${{ runner.os }}-${{ runner.arch }}-

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - name: Cache Gradle build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Validate build tools, DEX reader, and i18n catalogs
        run: |
          cargo test -p xtask --bin xtask
          cargo test -p wekit-zygisk --lib
          ./x i18n-check

      - name: Build Release (Unsigned)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./x build --release

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist/apk
          for flavor in standard legacy; do
            cp -v app/build/outputs/apk/$flavor/release/*.apk dist/apk/
          done
          echo "Collected APKs:"
          ls -1 dist/apk

      - name: Upload Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: wekit-apk
          path: dist/apk/*.apk

  release-ci:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result == 'success' && github.repository == 'wings110/WeKit-dev' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: wekit-apk
          path: artifacts

      - name: Delete existing CI release (if exists)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release delete CI --repo wings110/WeKit --yes || true
          gh api -X DELETE repos/wings110/WeKit/git/refs/tags/CI || true

      - name: Generate update.json
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          GIT_HASH=$(git rev-parse --short HEAD)
          cat > artifacts/update.json <<EOF
          {
            "versionCode": ${COMMIT_COUNT},
            "versionName": "git+${GIT_HASH}",
            "commit": "${GIT_HASH}"
          }
          EOF
          echo "Generated update.json:"
          cat artifacts/update.json

      - name: Create CI release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual build' }}
        run: |
          {
            echo "本 Release 始终包含最新的 CI 构建产物。"
            echo ""
            echo "提交 SHA: \`${COMMIT_SHA}\`"
            echo ""
            echo "提交消息:"
            echo '```'
            echo "${COMMIT_MESSAGE}"
            echo '```'
          } > "$RUNNER_TEMP/ci-notes.md"

          gh release create CI \
            --repo wings110/WeKit \
            --title "CI" \
            --notes-file "$RUNNER_TEMP/ci-notes.md" \
            artifacts/*
